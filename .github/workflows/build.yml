name: Build Windows VST3
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DUHG_BUILD_PLUGIN=ON
      - name: Build VST3
        run: cmake --build build --config Release --target UltimateHighGain_VST3 --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: UltimateHighGain-Windows-VST3
          path: build/UltimateHighGain_artefacts/Release/VST3/
          if-no-files-found: error
      - name: Build standalone power diagnostics
        run: cmake --build build --config Release --target power_diagnostics --parallel 4
      - name: Run power diagnostics
        continue-on-error: true
        run: |
          & build/Release/power_diagnostics.exe | Tee-Object -FilePath power-diagnostics.csv
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: power-diagnostics
          path: power-diagnostics.csv
      - name: Publish diagnostic report
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path power-diagnostics.csv) {
            $rows = @(Import-Csv power-diagnostics.csv)
            $bad = @($rows | Where-Object { $_.ok -eq '0' })
            $known = @($bad | Where-Object { $_.model -eq '7' -and $_.cpu -ne '1' -and [double]$_.input_vrms -gt 0 -and [double]$_.input_vrms -le .01 -and [double]$_.thdn_pct -ge 25 })
            $active = @($bad | Where-Object { $_ -notin $known })
            $report = @{known_ac30=$known.Count;active_failed=$active.Count;commit=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;count=$rows.Count;failed=$bad.Count;failures=@($bad | Select-Object -First 50);rows=$rows} | ConvertTo-Json -Depth 5 -Compress
            $report | Set-Content -Encoding utf8 diagnostic-report.json
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/issues/1/comments" -f "body=Power diagnostics commit $env:GITHUB_SHA run $env:GITHUB_RUN_ID : $($rows.Count) rows, $($active.Count) active failures, $($known.Count) known AC30 failures ($($bad.Count) total). See workflow logs and artifact."
          }
      - name: Build DSP regression tests
        run: cmake --build build --config Release --target uhg_test presence_test tube_test quick_test preamp_test jose_test extra_test architecture_test shared_test stock_test evh_test stability_test --parallel 4
      - name: Run DSP regression tests
        continue-on-error: true
        run: ctest --test-dir build -C Release --output-on-failure -V
